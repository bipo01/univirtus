<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AVA Downloader</title>
    <link rel="icon" href="../icons/icon-32.png" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"><span></span><span></span><span></span></div>

    <header class="topbar">
      <div class="brand">
        <img src="../icons/icon-48.png" width="32" height="32" alt="" />
        <div>
          <strong>AVA Downloader</strong>
          <small>Suas aulas do Univirtus, de uma vez</small>
        </div>
      </div>
      <div class="topbar-right">
        <span id="who" class="pill" hidden></span>
        <button id="btn-refresh" class="btn ghost sm" type="button" hidden title="Ler o AVA de novo">
          <span data-icon="refresh"></span><span>Atualizar lista</span>
        </button>
        <button id="btn-theme" class="btn ghost sm icon-only" type="button" aria-label="Usar modo escuro" title="Usar modo escuro">
          <span data-icon="moon"></span>
        </button>
        <button id="btn-settings" class="btn ghost sm icon-only" type="button" aria-haspopup="dialog" aria-label="Configurações">
          <span data-icon="settings"></span>
        </button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <dialog id="settings" class="popover">
      <form method="dialog">
        <h2>Configurações</h2>
        <label class="field">
          <span>Downloads ao mesmo tempo</span>
          <select id="opt-concurrency">
            <option value="2">2 — conexão mais lenta</option>
            <option value="4">4 — recomendado</option>
            <option value="6">6</option>
            <option value="8">8 — internet bem rápida</option>
          </select>
        </label>
        <p class="hint">Mais downloads simultâneos só ajudam se a sua internet aguentar.</p>
        <div class="dialog-actions"><button class="btn primary" value="ok">Pronto</button></div>
      </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
